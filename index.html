<!DOCTYPE html>
<html>
  <head>
    <title>Heart Animation</title>
    <meta charset="UTF-8">
    <meta name="Keywords">
    <meta name="Description">

    <style>
      canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, .2);
      }
      audio {
        display: none; /* Hides the audio player from view */
      }
    </style>
  </head>
  <body>

    <!-- Canvas for heart animation -->
    <canvas id="heart" width="1920" height="947"></canvas>

    <!-- Add the audio element with autoplay -->
    <audio id="loveSong" src="sounds/Die For You.mp3" autoplay type="audio/mp3" loop></audio>

    <!-- JavaScript to start song at 1:26 -->
    <script>
      window.onload = function() {
        var audio = document.getElementById('loveSong');
        audio.currentTime = 86; // 1 minute 26 seconds = 86 seconds
        audio.play(); // Ensure the audio starts playing at the set time
      };
    </script>

    <!-- JavaScript file for heart animation -->
    <script src="heart-animation.js"></script>
  </body>
</html>
